<div class="alert prose-p:first:mt-0 prose-p:last:mb-0 color-success alert-soft border-soft"><div><span class="font-bold [font-size:inherit]">大虾、蒜、油、蚝油、生抽、鸡粉、盐、糖。</span></div></div>
<ul>
<li>处理虾，去虾线，开背；</li>
<li>蒜切碎。</li>
</ul>
<h2 id="烹饪-全程保持中小火">烹饪 <span class="[font-size:inherit] h-auto cursor-default btn btn-warning">全程保持中小火</span></h2>
<ul>
<li>起锅烧油，冷油直接放入大虾，中小火慢煎，煎至两面金黄焦香，捞出备用；</li>
<li>倒入蒜蓉，炒香；</li>
<li>放入煎好的大虾，翻炒均匀；</li>
<li>加入盐、生抽、蚝油、鸡精调味，持续翻炒一会，炒均匀入味后出锅。<span class="font-bold [font-size:inherit] text-primary">(可以提前准备好酱汁)</span></li>
</ul>
